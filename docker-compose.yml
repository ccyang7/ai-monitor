name: ai-monitor

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # 生产配置：模板见 deploy/.env.example
    # 所有 compose 命令走 deploy/compose.sh，它带上 --env-file .env.production
    env_file:
      - .env.production
    environment:
      POSTGRES_USER: ai_monitor
      POSTGRES_DB: ai_monitor
    # 2G 内存：连接数和共享缓冲都压小，把余量留给后端
    command:
      - postgres
      - -c
      - max_connections=40
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=512MB
    volumes:
      - pgdata:/var/lib/postgresql/data
    shm_size: 128mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_monitor -d ai_monitor"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      # 后端按 APP_ENV 选择加载哪份配置文件，这里显式钉死，避免漏配时按开发环境启动
      APP_ENV: production
      # 主机名必须是 compose 服务名 postgres，写 localhost 会指向后端容器自己
      DATABASE_URL: postgresql+psycopg://ai_monitor:${POSTGRES_PASSWORD:?请先在项目根 .env.production 里设置 POSTGRES_PASSWORD}@postgres:5432/ai_monitor
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8001"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ai-monitor-frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
