<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · AI Monitor</title>
<link rel="stylesheet" href="common.css">
<style>
/* 登录页专属样式：左右分栏，左侧品牌区深绿，右侧表单区浅色。
   登录页没有侧边栏，所以不复用 .shell 布局。 */

.auth {
  display: grid;
  grid-template-columns: 1.05fr .95fr;
  min-height: 100vh;
}

/* --- 左：品牌区 --- */

.auth-brand {
  position: relative;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 56px 64px;
  background: var(--green-800);
  color: #fff;
  overflow: hidden;
}

/* 一层很淡的光晕，避免大面积纯色显得平 */
.auth-brand::after {
  content: "";
  position: absolute;
  width: 620px;
  height: 620px;
  right: -260px;
  top: -180px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(82, 183, 136, .22), transparent 68%);
  pointer-events: none;
}

.auth-brand > * { position: relative; z-index: 1; }

.auth-logo {
  display: flex;
  align-items: center;
  gap: 11px;
  margin-bottom: 54px;
}

.auth-logo-mark {
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  border-radius: 12px;
  background: var(--green-400);
  color: var(--green-900);
}

.auth-logo-mark svg { width: 21px; height: 21px; }

.auth-logo-name { font-size: var(--fs-md); font-weight: 650; }
.auth-logo-sub { font-size: 11px; color: rgba(255, 255, 255, .5); line-height: 1.3; }

.auth-pitch {
  font-size: 32px;
  font-weight: 640;
  line-height: 1.45;
  letter-spacing: -.01em;
  color: #fff;
  max-width: 15em;
  margin-bottom: 40px;
}

/* 简报条示例：让用户在登录前就看见产品的样子 */
.sample {
  max-width: 400px;
  border-radius: var(--r-lg);
  background: rgba(255, 255, 255, .07);
  border: 1px solid rgba(255, 255, 255, .1);
  padding: 17px 19px;
}

.sample-stamp {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: var(--fs-xs);
  color: rgba(255, 255, 255, .5);
  margin-bottom: 10px;
}

.sample-stamp .dot { color: var(--green-400); }

.sample-text {
  font-size: var(--fs-base);
  line-height: 1.75;
  color: rgba(255, 255, 255, .82);
}

.sample-text b { color: #fff; font-weight: 650; }

/* --- 右：表单区 --- */

.auth-form {
  display: grid;
  place-items: center;
  padding: 48px 32px;
  background: var(--paper);
}

.auth-form-inner { width: 100%; max-width: 372px; }

.auth-form-title { font-size: var(--fs-2xl); font-weight: 680; letter-spacing: -.015em; }

.auth-form-sub { color: var(--muted); font-size: var(--fs-base); margin: 5px 0 30px; }

.auth-fields { display: flex; flex-direction: column; gap: 17px; }

/* 密码框里叠一个"显示密码"按钮 */
.pw-wrap { position: relative; }

.pw-wrap .input { padding-right: 42px; }

.pw-toggle {
  position: absolute;
  right: 5px;
  top: 50%;
  transform: translateY(-50%);
  width: 32px;
  height: 32px;
  display: grid;
  place-items: center;
  border: 0;
  border-radius: var(--r-sm);
  background: transparent;
  color: var(--faint);
  cursor: pointer;
}

.pw-toggle:hover { color: var(--green-500); background: var(--green-50); }
.pw-toggle svg { width: 16px; height: 16px; }

.auth-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin: 18px 0 22px;
  font-size: var(--fs-sm);
}

.check {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  color: var(--muted);
  cursor: pointer;
}

.check input { width: 15px; height: 15px; accent-color: var(--green-500); margin: 0; }

.link { color: var(--green-500); font-weight: 600; }
.link:hover { color: var(--green-600); text-decoration: underline; }

.auth-submit { width: 100%; padding: 12px; font-size: var(--fs-md); }

.auth-alt {
  margin-top: 24px;
  text-align: center;
  font-size: var(--fs-sm);
  color: var(--muted);
}

/* 表单级错误提示：需求要求"不区分是用户名错还是密码错" */
.auth-error {
  display: none;
  align-items: flex-start;
  gap: 8px;
  margin-bottom: 20px;
  padding: 11px 13px;
  border-radius: var(--r-md);
  background: var(--red-bg);
  color: var(--red);
  font-size: var(--fs-sm);
}

.auth-error.is-on { display: flex; }
.auth-error svg { width: 16px; height: 16px; flex: none; margin-top: 2px; }


@media (max-width: 900px) {
  .auth { grid-template-columns: 1fr; }
  .auth-brand { padding: 40px 28px 44px; }
  .auth-pitch { font-size: 25px; margin-bottom: 26px; }
  .auth-logo { margin-bottom: 32px; }
  .auth-form { padding: 40px 24px 56px; }
}
</style>
</head>
<body>

<div class="auth">

  <!-- ============ 左：品牌区 ============ -->
  <section class="auth-brand">
    <div class="auth-logo">
      <div class="auth-logo-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 12h3.5l2.5-6 4 13 2.5-7h7.5"/>
        </svg>
      </div>
      <div>
        <div class="auth-logo-name">AI Monitor</div>
        <div class="auth-logo-sub">大模型使用监控</div>
      </div>
    </div>

    <h1 class="auth-pitch">你的模型今天跑了多少、慢在哪、哪里不对劲。</h1>

    <div class="sample">
      <div class="sample-stamp">
        <span class="dot"></span>
        <span>今天 09:15 更新</span>
      </div>
      <p class="sample-text">
        今天调用 <b>145 次</b>，比昨天多 32%。deepseek-chat 占 <b>82%</b>，费用 ¥12.40。
        有 <b>2 次异常</b>调用已标出。
      </p>
    </div>
  </section>

  <!-- ============ 右：表单区 ============ -->
  <section class="auth-form">
    <div class="auth-form-inner">

      <h2 class="auth-form-title">登录</h2>
      <p class="auth-form-sub">用你的账号继续</p>

      <!-- 演示用：点击登录后显示此错误 -->
      <div class="auth-error" id="authError">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round">
          <circle cx="12" cy="12" r="9"/><path d="M12 8v4.5M12 16h.01"/>
        </svg>
        <span>用户名或密码错误</span>
      </div>

      <form class="auth-fields" onsubmit="return demoLogin(event)">
        <div class="field">
          <label class="field-label" for="username">用户名</label>
          <input class="input" id="username" name="username" type="text"
                 placeholder="输入用户名" autocomplete="username" required>
        </div>

        <div class="field">
          <label class="field-label" for="password">密码</label>
          <div class="pw-wrap">
            <input class="input" id="password" name="password" type="password"
                   placeholder="输入密码" autocomplete="current-password" required>
            <button class="pw-toggle" type="button" aria-label="显示密码"
                    onclick="togglePassword(this)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                   stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/>
                <circle cx="12" cy="12" r="2.6"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="auth-row">
          <label class="check">
            <input type="checkbox" checked>
            <span>记住我</span>
          </label>
          <a class="link" href="#">忘记密码？</a>
        </div>

        <button class="btn btn-primary auth-submit" type="submit">登录</button>
      </form>

      <p class="auth-alt">
        还没有账号？<a class="link" href="#">注册一个</a>
      </p>
    </div>
  </section>

</div>

<script>
/* 原型演示逻辑：真实实现由 Vue 组件承担，这里只为让原型可点击。 */

function togglePassword(btn) {
  const input = btn.parentElement.querySelector('input');
  const shown = input.type === 'text';
  input.type = shown ? 'password' : 'text';
  btn.setAttribute('aria-label', shown ? '显示密码' : '隐藏密码');
}

function demoLogin(e) {
  e.preventDefault();
  // 原型里固定展示错误态，方便你看到这个组件长什么样
  document.getElementById('authError').classList.add('is-on');
  return false;
}
</script>

</body>
</html>
